name: Publish GitHub Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag on main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Validate the tag and release record
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD origin/main
          node scripts/verify-version.mjs "$TAG"
          published=$(gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName')
          if grep -Fxq "$TAG" <<< "$published"; then
            echo "::error::A published release already exists for $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --reporter=dot
      - run: npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=high
      - run: npm run test:desktop
      - name: Build Windows installer
        run: npm run package:win
      - name: Verify packaged update helper
        shell: pwsh
        run: |
          $env:TOOLBOX_SMOKE_RUNTIME = (Resolve-Path -LiteralPath 'release/win-unpacked/极客工具箱.exe').Path
          npm run test:updater
      - name: Generate update manifest
        shell: pwsh
        run: |
          $installer = "release/GeekToolbox-Setup-$env:VERSION.exe"
          npm run release:desktop -- --skip-build --installer $installer
      - name: Exercise NSIS over the previous published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./tests/windows/install-smoke.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release
          path: |
            updates/desktop/version.json
            updates/desktop/GeekToolbox-Setup-*.exe
          if-no-files-found: error

  cli:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      - run: npm run test:cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: cli-release
          path: dist-cli/GeekToolbox-CLI-*.mjs
          if-no-files-found: error

  publish:
    needs: [prepare, windows, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-release'
          path: release-assets
          merge-multiple: true
      - name: Verify assets, upload to draft and publish
        shell: bash
        run: |
          set -euo pipefail
          installer="GeekToolbox-Setup-$VERSION.exe"
          cli="GeekToolbox-CLI-$VERSION.mjs"
          assets=("$installer" "$cli" version.json)
          cd release-assets
          test "$(jq -r .version version.json)" = "$VERSION"
          test "$(jq -r .kind version.json)" = nsis
          test "$(jq -r .package.url version.json)" = "$installer"
          test "$(jq -r .package.size version.json)" = "$(stat -c %s "$installer")"
          test "$(jq -r .package.sha256 version.json)" = "$(sha256sum "$installer" | cut -d ' ' -f 1)"
          test "$(node "$cli" --version)" = "$VERSION"
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          assets+=(SHA256SUMS.txt)
          cd ..
          node scripts/verify-version.mjs "$TAG" --notes > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = true
            for asset in "${assets[@]}"; do
              gh release upload "$TAG" "release-assets/$asset" --clobber
            done
          else
            paths=()
            for asset in "${assets[@]}"; do paths+=("release-assets/$asset"); done
            gh release create "$TAG" "${paths[@]}" --draft --verify-tag --title "极客工具箱 $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release view "$TAG" --json assets --jq '.assets' > "$RUNNER_TEMP/assets.json"
          test "$(jq length "$RUNNER_TEMP/assets.json")" = "${#assets[@]}"
          for asset in "${assets[@]}"; do
            digest=$(jq -er --arg name "$asset" '.[] | select(.name == $name) | .digest' "$RUNNER_TEMP/assets.json")
            test "$digest" = "sha256:$(sha256sum "release-assets/$asset" | cut -d ' ' -f 1)"
          done
          gh release edit "$TAG" --draft=false --latest --title "极客工具箱 $TAG" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Verify published downloads and cryptographic release attestations
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/published"
          gh release download "$TAG" --dir "$RUNNER_TEMP/published"
          cd "$RUNNER_TEMP/published"
          sha256sum -c SHA256SUMS.txt
          for asset in *; do
            for attempt in 1 2 3 4 5; do
              if gh release verify-asset "$TAG" "$asset"; then break; fi
              test "$attempt" -lt 5
              sleep 5
            done
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name | grep -Fx "$TAG"
