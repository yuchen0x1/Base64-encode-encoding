name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的 vX.Y.Z 标签；仅用于手动重跑发布'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      TOOLBOX_AUTHENTICODE_THUMBPRINT: ${{ secrets.WINDOWS_AUTHENTICODE_THUMBPRINT }}
      TOOLBOX_AUTHENTICODE_SUBJECT: ${{ secrets.WINDOWS_AUTHENTICODE_SUBJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tag must match vMAJOR.MINOR.PATCH: $tag" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $tag) { throw "Tag $tag does not match package.json version $version" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test and lint
        run: |
          npm test -- --reporter=dot
          npm run lint
      - name: Build frontend
        run: npm run build
      - name: Build Windows installer
        shell: pwsh
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify Authenticode signature when configured
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "release/GeekToolbox-Setup-${{ steps.release.outputs.version }}.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Windows installer was not produced: $installer" }
          $expected = ($env:TOOLBOX_AUTHENTICODE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ([string]::IsNullOrWhiteSpace($expected)) {
            Write-Host 'WINDOWS_AUTHENTICODE_THUMBPRINT is not configured; unsigned release is allowed and will not claim a signature.'
            exit 0
          }
          if ($expected -notmatch '^[A-F0-9]{40}$') { throw 'WINDOWS_AUTHENTICODE_THUMBPRINT must be a 40-character hexadecimal thumbprint' }
          $sig = Get-AuthenticodeSignature -LiteralPath $installer
          if ($sig.Status -ne 'Valid') { throw "Windows installer Authenticode status is $($sig.Status)" }
          $actual = ($sig.SignerCertificate.Thumbprint -replace '\s', '').ToUpperInvariant()
          if ($actual -ne $expected) { throw 'Windows installer Authenticode thumbprint does not match WINDOWS_AUTHENTICODE_THUMBPRINT' }
          Write-Host 'Windows installer Authenticode signature and configured thumbprint verified.'
      - name: Generate update manifests
        shell: pwsh
        run: npm run release:desktop -- --skip-build --installer "release/GeekToolbox-Setup-${{ steps.release.outputs.version }}.exe"
      - name: Verify release assets
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $assets = @(
            "updates/desktop/version.json",
            "updates/desktop/GeekToolbox-Setup-$version.exe",
            "updates/web/version.json",
            "updates/web/geek-toolbox-web-$version.zip"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Missing release asset: $asset" }
          }
          $manifest = Get-Content "updates/desktop/version.json" -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version -or $manifest.kind -ne 'nsis') { throw 'Desktop manifest version/kind mismatch' }
          if ($manifest.package.sha256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Desktop manifest SHA-256 is missing or invalid' }
      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $version = '${{ steps.release.outputs.version }}'
          $notes = if (Test-Path "release-notes.json") {
            $all = Get-Content "release-notes.json" -Raw | ConvertFrom-Json -AsHashtable
            if ($all.ContainsKey($version) -and $all[$version].notes) { ($all[$version].notes | ForEach-Object { "- $_" }) -join "`n" } else { "自动发布 v$version" }
          } else { "自动发布 v$version" }
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding UTF8
          $assets = @(
            "updates/desktop/GeekToolbox-Setup-$version.exe",
            "updates/desktop/version.json",
            "updates/web/geek-toolbox-web-$version.zip",
            # GitHub Release asset names must be unique. Keep the desktop
            # manifest as version.json because the packaged updater uses the
            # latest/download/version.json URL by default.
            (Join-Path $env:RUNNER_TEMP "web-version.json")
          )
          Copy-Item -LiteralPath "updates/web/version.json" -Destination $assets[3] -Force
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; updating its assets for an idempotent manual rerun."
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "极客工具箱 v$version" --notes-file $notesFile
          } else {
            gh release create $tag @assets --title "极客工具箱 v$version" --notes-file $notesFile
          }
