name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - name: Verify packaged update helper
        shell: pwsh
        run: |
          $env:TOOLBOX_SMOKE_RUNTIME = (Resolve-Path -LiteralPath 'release/win-unpacked/极客工具箱.exe').Path
          npm run test:updater
      - name: Exercise installer lifecycle for a release candidate
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          npm run release:desktop -- --skip-build --installer "release/GeekToolbox-Setup-$version.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/windows/install-smoke.ps1 -Version $version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-Installer
          path: release/GeekToolbox-Setup-*.exe
          if-no-files-found: error
