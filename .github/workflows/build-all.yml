name: Build Multiplatform Release (Windows, Android, iOS, macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. 苹果 macOS 桌面端打包 (DMG / Zip)
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Build macOS app & DMG
        run: npx electron-builder --mac
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-App-DMG
          path: release/*.dmg

  # 2. 苹果 iOS 移动端打包 (Xcode Archive / IPA)
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Upload iOS Xcode Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-Build
          path: ios/App/build/Release-iphoneos/App.app

  # 3. 安卓 APK 打包
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build Android Debug APK (unsigned)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

  # 4. Windows PC 端打包
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Package Windows
        run: npx electron-builder --win nsis portable
      - name: Upload Windows Portable Exe
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Portable-Exe
          path: release/*.exe
