<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>极客工具箱 - Windows 本地开发者工具箱</title>
    <meta name="description" content="Windows 本地工具箱，提供编解码、加解密、JSON、时间戳、文本对比和批量处理。" />
    <!-- 默认拒绝；WASM 仅允许编译本地资源，外链由主进程白名单再次拦截。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-rYIoqT9HFSPJMu6kRbr9C75Q4NqD3dzajL8QIKrU/kQ='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:5173 ws://127.0.0.1:5173; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="theme-color" content="#090d16" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <!-- 仅这一段同步主题初始化脚本通过 CSP 哈希白名单执行，不开放 unsafe-inline。 -->
    <script>(function(){try{var s=JSON.parse(localStorage.getItem('geek-toolbox-state')||'{}');var d=typeof s.isDark==='boolean'?s.isDark:true;var r=document.documentElement;r.classList.toggle('dark',d);r.classList.toggle('light',!d);r.style.colorScheme=d?'dark':'light'}catch(e){}})()</script>
  </head>
  <body class="bg-surface text-main select-none-ui">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
