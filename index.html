<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>极客工具箱 - Windows 本地开发者工具箱</title>
    <meta name="description" content="Windows 本地工具箱，提供编解码、加解密、JSON、时间戳、文本对比和批量处理。" />
    <!-- Content Security Policy 强化防御 XSS 注入与未授权外链 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' https:;" />
    <meta name="theme-color" content="#090d16" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <script>
      // 主题预应用：在首帧渲染前同步 <html> 主题类名，避免深浅色闪烁
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('geek-toolbox-state') || '{}')
          var dark = typeof s.isDark === 'boolean' ? s.isDark : true
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.classList.toggle('light', !dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) { /* 忽略存储异常，使用默认深色主题 */ }
      })()
    </script>
  </head>
  <body class="bg-surface text-main select-none-ui">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
